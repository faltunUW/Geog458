<!DOCTYPE html>
<!-- Use HTML for this page. -->
<html lang='en'>
<head>
    <!-- Set the text coding, tab title, and screen size. -->
    <meta charset='utf-8' />
    <title>my First Map</title>
    <meta name='viewport' content='width=device-width, initial-scale=1' />

    <!-- Used v3.6.0 for both Mapbox files so the style setting is supported. -->
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css' rel='stylesheet' />
    <style>
        /* Removes the page spacing and makes the map fill the window. */
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
</head>
<body>
    <!-- Mapbox draws the map inside this div. -->
    <div id='map'></div>
    <script>
        // Uses my public token to connect Mapbox requests to my account.
        mapboxgl.accessToken = 'pk.eyJ1IjoiZmFsdHVuIiwiYSI6ImNtdXgwZDJycTAzdWYzMHEzeTAyOWJlazAifQ.zJ_jK-CGtFRupxK45AgFqQ';

        // Creates the map and displays it inside the div with id='map'.
        const mymap = new mapboxgl.Map({
            container: 'map', // Match the map div's id.
            // Part 3: comment these out to load Mapbox Standard with its defaults.
            // style: 'mapbox://styles/mapbox/light-v11',
            // projection: 'globe',

            // Part 2: these settings showed the UW Seattle campus.
            // center: [-122.3035, 47.6553],
            // zoom: 15,

            center: [-122.3570, 47.6365], // Start at Queen Anne, Seattle: [longitude, latitude].
            zoom: 14 // Show the neighborhood's streets and blocks.
        });

        // Adds a button to enter or exit fullscreen.
        mymap.addControl(new mapboxgl.FullscreenControl());

        // Adds zoom buttons and a compass that resets the map to north.
        mymap.addControl(new mapboxgl.NavigationControl());

        // Waits until the style loads before changing its settings.
        mymap.on('style.load', () => {
            // setConfigProperty takes the style import id, setting name, and new value.
            // 'basemap' is the Standard basemap; 'dusk' gives it evening lighting.
            mymap.setConfigProperty('basemap', 'lightPreset', 'dusk');

            // false hides point-of-interest labels, like shops and restaurants.
            mymap.setConfigProperty('basemap', 'showPointOfInterestLabels', false);

            // Set the showPlaceLabels to true to show city and neighborhood names.
            // These labels help us locate Queen Anne and nearby neighborhoods.
            mymap.setConfigProperty('basemap', 'showPlaceLabels', true);

            // Set the showTransitLabels to false to hide transit labels and icons.
            // This leaves less symbols and it is useful for a map to be less crowded.
            mymap.setConfigProperty('basemap', 'showTransitLabels', false);

            // Set the show3dObjects to true to show 3D building.
            // This helps show building with heightswhen exploring the map.
            mymap.setConfigProperty('basemap', 'show3dObjects', true);

            // Set font to Source Sans Pro to change the map's label lettering.
            // Its simple letters are useful when keeping labels easy to read.
            mymap.setConfigProperty('basemap', 'font',  'Source Sans Pro');
        });
    </script>
</body>
</html>
